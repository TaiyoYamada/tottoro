name: Release

# On every push to main, release-please keeps a release pull request up to date.
# It bumps MARKETING_VERSION in project.yml and writes CHANGELOG.md from the Conventional Commits.
# Merging that pull request tags the release. Xcode Cloud builds and uploads it to App Store Connect.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  # The release commit is made on main. Bring it back to develop, so the next release starts from it.
  back-merge:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Open a pull request from main to develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr create --repo "$GITHUB_REPOSITORY" --base develop --head main
          --title "chore: bring the release back to develop"
          --body "Brings the release commit that release-please made on main back to develop. Merge it with a merge commit."

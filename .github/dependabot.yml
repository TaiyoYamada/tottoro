version: 2
updates:
  - package-ecosystem: swift
    directory: /TottoroKit
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

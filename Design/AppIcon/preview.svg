<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Only for looking at the layers together. Icon Composer adds the corner shape and the glass -->
  <clipPath id="shape"><rect width="1024" height="1024" rx="230"/></clipPath>
  <g clip-path="url(#shape)">
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset="1" stop-color="#0057E0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#blue)"/>

  <!-- The countdown ring from the app: a faint track, and the time left as a thick arc from the top -->
  <circle cx="512" cy="512" r="330" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="72"/>
  <path d="M 512 182 A 330 330 0 1 1 182 512" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round"/>

  <defs>
    <mask id="keyhole">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="512" cy="548" r="24" fill="#000000"/>
      <rect x="500" y="556" width="24" height="52" rx="12" fill="#000000"/>
    </mask>
  </defs>
  <path d="M 440 476 V 418 A 72 72 0 0 1 584 418 V 476" fill="none" stroke="#FFFFFF" stroke-width="44" stroke-linecap="round"/>
  <rect x="392" y="470" width="240" height="180" rx="40" fill="#FFFFFF" mask="url(#keyhole)"/>

  </g>
</svg>

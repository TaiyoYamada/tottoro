name: Tottoro

options:
  bundleIdPrefix: com.taiyo
  developmentLanguage: ja
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

# bundle ID、表示名、署名のチームは Configs/ の xcconfig で決める。
# ここの settings は xcconfig より強いので、同じ設定をここに書かない
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  TottoroKit:
    path: TottoroKit

targets:
  Tottoro:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tottoro
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Tottoro/Tottoro.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSFaceIDUsageDescription: コードを表示する前に、Face ID でロックを解除します。
        INFOPLIST_KEY_NSCameraUsageDescription: 二要素認証の QR コードを読み取るためにカメラを使います。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: TottoroAutoFill
      - package: TottoroKit
        product: TottoroCore
      - package: TottoroKit
        product: TottoroStorage

  TottoroAutoFill:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TottoroAutoFill
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).AutoFill
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TottoroAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: TottoroAutoFill/TottoroAutoFill.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSFaceIDUsageDescription: コードを入力する前に、Face ID でロックを解除します。
    dependencies:
      - package: TottoroKit
        product: TottoroCore
      - package: TottoroKit
        product: TottoroStorage

  TottoroTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TottoroTests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tottoro

schemes:
  Tottoro:
    build:
      targets:
        Tottoro: all
        TottoroAutoFill: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TottoroTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

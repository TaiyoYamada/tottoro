name: Tottoro

options:
  bundleIdPrefix: com.taiyo
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

# bundle ID、表示名、署名のチームは Configs/ の xcconfig で決める。
# ここの settings は xcconfig より強いので、同じ設定をここに書かない
configFiles:
  Debug: Configs/Debug.xcconfig
  Release: Configs/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # 新しい文字列を String Catalog に足せるよう、コンパイラに文字列を書き出させる
    SWIFT_EMIT_LOC_STRINGS: YES

packages:
  TottoroKit:
    path: TottoroKit
  # Xcode はアプリの依存の版も TottoroKit/Package.resolved に書くが、Dependabot はそこを
  # TottoroKit の依存としてしか見ないので、ここで版を固定し、上げるときは手で直す
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6

targets:
  Tottoro:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Tottoro
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Tottoro/Tottoro.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock with Face ID before showing your codes.
        INFOPLIST_KEY_NSCameraUsageDescription: Tottoro uses the camera to scan two-factor authentication QR codes.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    dependencies:
      - target: TottoroAutoFill
      - package: TottoroKit
        product: TottoroCore
      - package: TottoroKit
        product: TottoroStorage

  TottoroAutoFill:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TottoroAutoFill
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).AutoFill
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: TottoroAutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: TottoroAutoFill/TottoroAutoFill.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_NSFaceIDUsageDescription: Unlock with Face ID before entering a code.
    dependencies:
      - package: TottoroKit
        product: TottoroCore
      - package: TottoroKit
        product: TottoroStorage

  TottoroTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TottoroTests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        # XcodeGen は iPhone の形の TEST_HOST しか作らないので、Mac の .app の中の実行ファイルを指す
        TEST_HOST[sdk=macosx*]: $(BUILT_PRODUCTS_DIR)/Tottoro.app/Contents/MacOS/Tottoro
    dependencies:
      - target: Tottoro

  # 画像はシミュレータの機種と OS で変わるので、iPhone だけで撮る
  TottoroSnapshotTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources:
      - path: TottoroSnapshotTests
        type: syncedFolder
        excludes:
          - "**/__Snapshots__/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).snapshot-tests
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tottoro
      - package: SnapshotTesting

  TottoroUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: TottoroUITests
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).ui-tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Tottoro

schemes:
  Tottoro:
    build:
      targets:
        Tottoro: all
        TottoroAutoFill: all
    run:
      config: Debug
    test:
      config: Debug
      testPlans:
        - path: TestPlans/Unit.xctestplan
          defaultPlan: true
        - path: TestPlans/UI.xctestplan
        - path: TestPlans/Screenshots.xctestplan
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
